<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="doneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="plannedGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="380" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">3-Phase Curriculum Learning Pipeline</text>
  <text x="410" y="52" text-anchor="middle" font-size="11" fill="#64748b">Each phase resumes from the best checkpoint of the previous phase</text>

  <!-- Legend -->
  <g transform="translate(490, 66)">
    <rect width="310" height="28" rx="6" fill="white" stroke="#e2e8f0"/>
    <rect x="10" y="7" width="14" height="14" rx="3" fill="url(#doneGrad)"/>
    <text x="30" y="18" font-size="10" fill="#475569">Done</text>
    <rect x="80" y="7" width="14" height="14" rx="3" fill="url(#activeGrad)"/>
    <text x="100" y="18" font-size="10" fill="#475569">In Progress</text>
    <rect x="185" y="7" width="14" height="14" rx="3" fill="url(#plannedGrad)"/>
    <text x="205" y="18" font-size="10" fill="#475569">Planned</text>
  </g>

  <!-- ============ P1 Row (y=100) ============ -->
  <text x="50" y="120" font-size="12" font-weight="700" fill="#1e293b">P1</text>
  <text x="50" y="134" font-size="9" fill="#64748b">Flat · Bootstrap</text>
  <!-- P1 Coarse -->
  <g filter="url(#shadow)">
    <rect x="130" y="100" width="155" height="48" rx="8" fill="url(#doneGrad)"/>
    <text x="207" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="white">P1 Coarse</text>
    <text x="207" y="138" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Standing</text>
  </g>
  <line x1="285" y1="124" x2="320" y2="124" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- P1 Fine -->
  <g filter="url(#shadow)">
    <rect x="325" y="100" width="155" height="48" rx="8" fill="url(#doneGrad)"/>
    <text x="402" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="white">P1 Fine</text>
    <text x="402" y="138" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Standing</text>
  </g>
  <rect x="510" y="108" width="50" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
  <text x="535" y="123" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">FLAT</text>
  <text x="580" y="126" font-size="14" fill="#22c55e">&#10003;</text>

  <!-- Resume arrow P1_F → P2_C -->
  <path d="M 402 148 L 402 170 Q 402 180 392 180 L 218 180 Q 207 180 207 190 L 207 205" stroke="#22c55e" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- ============ P2 Row (y=205) ============ -->
  <text x="50" y="225" font-size="12" font-weight="700" fill="#1e293b">P2</text>
  <text x="50" y="239" font-size="9" fill="#64748b">Flat · Velocity</text>
  <!-- P2 Coarse -->
  <g filter="url(#shadow)">
    <rect x="130" y="205" width="155" height="48" rx="8" fill="url(#doneGrad)"/>
    <text x="207" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="white">P2 Coarse</text>
    <text x="207" y="243" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Velocity Track</text>
  </g>
  <line x1="285" y1="229" x2="320" y2="229" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- P2 Fine -->
  <g filter="url(#shadow)">
    <rect x="325" y="205" width="155" height="48" rx="8" fill="url(#doneGrad)"/>
    <text x="402" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="white">P2 Fine</text>
    <text x="402" y="243" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Velocity Track</text>
  </g>
  <rect x="510" y="213" width="50" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
  <text x="535" y="228" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">FLAT</text>
  <text x="580" y="231" font-size="14" fill="#22c55e">&#10003;</text>

  <!-- Resume arrow P2_F → P3_C -->
  <path d="M 402 253 L 402 275 Q 402 285 392 285 L 218 285 Q 207 285 207 295 L 207 310" stroke="#22c55e" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- ============ P3 Row (y=310) ============ -->
  <text x="50" y="330" font-size="12" font-weight="700" fill="#1e293b">P3</text>
  <text x="50" y="344" font-size="9" fill="#64748b">Gentle Terrain</text>
  <!-- P3 Coarse (IN PROGRESS) -->
  <g filter="url(#shadow)">
    <rect x="130" y="310" width="155" height="48" rx="8" fill="url(#activeGrad)"/>
    <text x="207" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="white">P3 Coarse</text>
    <text x="207" y="348" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Terrain Walk</text>
  </g>
  <line x1="285" y1="334" x2="320" y2="334" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- P3 Fine (PLANNED) -->
  <g filter="url(#shadow)">
    <rect x="325" y="310" width="155" height="48" rx="8" fill="url(#plannedGrad)"/>
    <text x="402" y="332" text-anchor="middle" font-size="13" font-weight="700" fill="white">P3 Fine</text>
    <text x="402" y="348" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Terrain Walk</text>
  </g>
  <rect x="510" y="318" width="140" height="22" rx="11" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="580" y="333" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">90/10 → 85/15 Grid</text>

  <!-- Hardware badge -->
  <rect x="640" y="290" width="170" height="48" rx="8" fill="#0f172a"/>
  <text x="725" y="310" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">TRAINING</text>
  <text x="725" y="327" text-anchor="middle" font-size="12" font-weight="700" fill="white">4×RTX 6000D · 4096 envs</text>
</svg>
