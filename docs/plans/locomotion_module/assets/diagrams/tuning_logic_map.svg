<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="700" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Locomotion 调参逻辑图</text>
  <text x="700" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">先判断问题属于跟踪、静止还是抗扰，再决定调 reward、课程还是扰动强度</text>

  <rect x="130" y="160" width="1140" height="180" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">先看什么</text>
  <rect x="180" y="240" width="220" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="290" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1d4ed8">reward 趋势</text>
  <rect x="440" y="240" width="220" height="70" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="550" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#15803d">episode length</text>
  <rect x="700" y="240" width="220" height="70" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="810" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309">bad_orientation</text>
  <rect x="960" y="240" width="260" height="70" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1090" y="282" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#b91c1c">stand_still / feet_slide</text>

  <rect x="130" y="410" width="360" height="310" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="310" y="456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">问题 1：跟踪差</text>
  <text x="310" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">先检查是不是扰动过强</text>
  <text x="310" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">再检查跟踪 reward 是否被压得太低</text>
  <text x="310" y="586" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">最后再看 PPO 超参数</text>
  <text x="310" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">优先回调：扰动课程，不是先重写算法</text>

  <rect x="520" y="410" width="360" height="310" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">问题 2：停不稳</text>
  <text x="700" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">增加 `rel_standing_envs`</text>
  <text x="700" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">缩短命令切换时间</text>
  <text x="700" y="586" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">适度加大 `stand_still`</text>
  <text x="700" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">优先加强“零命令样本密度”</text>

  <rect x="910" y="410" width="360" height="310" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1090" y="456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">问题 3：一受扰就倒</text>
  <text x="1090" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">先保留轻 push，再加 interval force/torque</text>
  <text x="1090" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">扩大 reset 速度和姿态范围</text>
  <text x="1090" y="586" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">观察 bad_orientation 是否回落</text>
  <text x="1090" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">优先渐进加难，不要一次打满</text>
</svg>
