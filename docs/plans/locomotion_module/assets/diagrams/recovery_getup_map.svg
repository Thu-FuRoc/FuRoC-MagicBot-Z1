<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="700" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Recovery / Get-up 任务边界图</text>
  <text x="700" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">区分当前主线正在解决的轻度失衡恢复，与后续可能单开的跌倒起身任务</text>

  <rect x="110" y="160" width="500" height="500" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="360" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">A. 当前 locomotion 主线</text>
  <text x="360" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">目标：仍处于“可恢复站立域”时的抗扰与停稳</text>

  <rect x="170" y="300" width="380" height="80" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="360" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">速度偏差恢复</text>

  <rect x="170" y="410" width="380" height="80" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="360" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">轻度姿态偏差恢复</text>

  <rect x="170" y="520" width="380" height="80" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="360" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b45309">站立与行进中的外扰恢复</text>

  <rect x="790" y="160" width="500" height="500" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1040" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">B. 单开的 recovery / get-up</text>
  <text x="1040" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">目标：机器人已经摔倒后，重新恢复到站立姿态</text>

  <rect x="850" y="300" width="380" height="80" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="1040" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">侧躺 / 仰卧 / 趴卧起身</text>

  <rect x="850" y="410" width="380" height="80" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="1040" y="455" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#c2410c">更宽松 termination</text>

  <rect x="850" y="520" width="380" height="80" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="1040" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">单独的起身 reward 与课程</text>

  <rect x="260" y="720" width="880" height="80" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="768" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">结论：当前先把 stop-to-stand 和 push recovery 做稳；跌倒起身更适合单开任务</text>
</svg>
