<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="54" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">运动控制小脑训练模块地图</text>
  <text x="700" y="88" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">当前 Locomotion 专题只是一个入门样例，后续还可以并列扩展更多训练模块</text>

  <circle cx="700" cy="430" r="120" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="700" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">Locomotion</text>
  <text x="700" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b">入门样例</text>

  <rect x="130" y="180" width="260" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="260" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">基础 Locomotion</text>
  <text x="260" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">站稳 / 走路 / 转向 / 停止</text>

  <rect x="505" y="140" width="390" height="100" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="700" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#3f6212">当前 Z1 样例</text>
  <text x="700" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">P1-P5 curriculum + robustness + tuning</text>

  <rect x="1010" y="180" width="260" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1140" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Terrain Robustness</text>
  <text x="1140" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">地形泛化 / 抗扰动</text>

  <rect x="100" y="560" width="280" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="240" y="610" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Recovery / Get-up</text>
  <text x="240" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">跌倒后恢复 / 起身</text>

  <rect x="410" y="690" width="250" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="535" y="740" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Imitation</text>
  <text x="535" y="770" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">演示学习步态</text>

  <rect x="740" y="690" width="250" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="865" y="740" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Sim-to-Real</text>
  <text x="865" y="770" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">域随机化 / 参数泛化</text>

  <rect x="1040" y="560" width="260" height="100" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1170" y="610" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Perception-Conditioned</text>
  <text x="1170" y="640" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">结合感知的运动控制</text>

  <line x1="610" y1="350" x2="330" y2="275" stroke="#94a3b8" stroke-width="3"/>
  <line x1="700" y1="310" x2="700" y2="240" stroke="#65a30d" stroke-width="4"/>
  <line x1="790" y1="350" x2="1070" y2="275" stroke="#94a3b8" stroke-width="3"/>
  <line x1="600" y1="510" x2="320" y2="560" stroke="#94a3b8" stroke-width="3"/>
  <line x1="660" y1="540" x2="560" y2="690" stroke="#94a3b8" stroke-width="3"/>
  <line x1="740" y1="540" x2="840" y2="690" stroke="#94a3b8" stroke-width="3"/>
  <line x1="800" y1="510" x2="1080" y2="560" stroke="#94a3b8" stroke-width="3"/>
</svg>
