site_name: FuRoC MagicBot-Z1
site_description: Deep Reinforcement Learning for MagicLab Z1 Bipedal Robot
site_url: https://phanghonghao.github.io/FuRoC-MagicBot-Z1

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem:
      smart_enable: all
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: README.md
  - Guides:
    - Sim2Sim Guide: guides/Sim2Sim_Guide.md
    - Logging Architecture: guides/Logging_Architecture.md
    - Monitor vs Orchestrator: guides/Monitor_vs_Orchestrator.md
    - Policy Export Pipeline: guides/Policy_Export_and_Verification_Pipeline.md
    - Orchestrator Guide: guides/Z1_Orchestrator_Guide.md
    - Policy Viewer Integration: guides/Z1_Policy_Viewer_Integration.md
    - GPU Train Sim Pipeline: guides/gpu_train_sim_pipeline_light.md
    - Local MuJoCo Keyboard: guides/local_mujoco_keyboard_guide.md
    - Orchestrator Video Pipeline: guides/orchestrator_video_pipeline.md
    - Play Z1 Video Version Compare: guides/play_z1_video_version_compare.md
  - Manual Commands:
    - Overview: manual_commands/README.md
    - Config Generation: manual_commands/config_generation.md
    - Launch Training: manual_commands/launch_training.md
    - Monitor & Control: manual_commands/monitor_and_control.md
    - Phase Params: manual_commands/phase_params.md
    - Terminal Commands: manual_commands/terminal_commands.md
    - Video Recording: manual_commands/video_recording.md
    - Zombie Cleanup: manual_commands/zombie_cleanup.md
  - Plans:
    - Step 3 Retrain Plan: plans/Step3_ExplicitPD_Retrain_Plan.md
    - Z1 5Phase Auto Pipeline: plans/Z1_5Phase_Auto_Pipeline.md
    - Locomotion Robustness: plans/Z1_Locomotion_Robustness_Training_Notes.md
    - Manipulation Roadmap: plans/Z1_Manipulation_Roadmap.md
    - Phase Summary: plans/z1_phase_summary.md
    - Phase Sync Report (CN): plans/z1_phase_sync_report_cn.md
    - Phase Sync Report Fixed: plans/z1_phase_sync_report_cn_fixed.md
    - Phase Weights and Goals: plans/z1_phase_weights_and_goals_cn.md
  - Tracking:
    - Damping Strategy: tracking/z1_damping_strategy_comparison.md
    - Terrain Loading Status: tracking/terrain_loading_status.md
    - Training Architecture Origin: tracking/training_architecture_origin.md
    - GPU Train Skill Framework: tracking/gpu_train_skill_framework.md
    - MagicBot Z1 Framework Map: tracking/magicbot_z1_framework_full_map.md
