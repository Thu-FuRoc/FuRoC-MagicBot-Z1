<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPU-Train Gateway</title>
  <style>
    body{font-family:"Microsoft YaHei",Arial,sans-serif;margin:20px;background:#f6f8fb;color:#111}
    .card{background:#fff;border:1px solid #dfe3ea;border-radius:10px;padding:14px;margin-bottom:12px}
    input,button,textarea{padding:8px;margin:4px 0}
    textarea{width:100%;height:260px;font-family:Consolas,monospace}
    .row{display:flex;gap:10px;flex-wrap:wrap}
  </style>
</head>
<body>
  <h2>GPU-Train Gateway</h2>
  <div class="card">
    <div>Token TTL: {{ttl}} hours</div>
    <div>用户名</div><input id="u" value="admin" />
    <div>密码</div><input id="p" type="password" value="ChangeMe!123" />
    <button onclick="login()">登录</button>
    <div id="role"></div>
  </div>

  <div class="card row">
    <button onclick="call('/api/status')">状态</button>
    <button onclick="call('/api/tail?lines=30')">Tail 30</button>
    <button onclick="post('/api/orchestrator/resume', {})">Resume</button>
    <input id="phase" placeholder="p3_coarse" />
    <button onclick="startFrom()">Start From</button>
  </div>

  <div class="card">
    <textarea id="out" readonly></textarea>
  </div>

<script>
let token = "";
async function login(){
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  const j = await r.json();
  if(!r.ok){alert(j.detail||'login failed');return;}
  token = j.token;
  document.getElementById('role').innerText = 'role: ' + j.role;
}
async function call(url){
  const r = await fetch(url,{headers:{'Authorization':'Bearer '+token}});
  const j = await r.json();
  document.getElementById('out').value = JSON.stringify(j,null,2);
}
async function post(url,payload){
  const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});
  const j = await r.json();
  document.getElementById('out').value = JSON.stringify(j,null,2);
}
async function startFrom(){
  const p = document.getElementById('phase').value.trim();
  if(!p){alert('sub_phase required');return;}
  await post('/api/orchestrator/start-from',{sub_phase:p});
}
</script>
</body>
</html>
